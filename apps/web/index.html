<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>패턴 영작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 한 장의 문제 카드를 가운데에 두고, 위에는 챕터 진행(칸 막대), 아래는 결과. 노트·대시보드는 같은 폭의 목록 */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15202b; --mute:#5f6b7a; --line:#d5dbe3;
  --accent:#2b4fd8; --accent-ink:#ffffff; --accent-soft:#e6ebfc;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#a06a00; --warn-soft:#fbf0d4; --bad:#c23636; --bad-soft:#fbe6e6;
  --serif:"Noto Serif KR",Georgia,serif; --sans:"Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#1a222c; --ink:#e8edf3; --mute:#94a0ae; --line:#2e3946;
  --accent:#7c97ff; --accent-ink:#0d1220; --accent-soft:#222c4d;
  --ok:#5fcf8e; --ok-soft:#173326; --warn:#e8b94a; --warn-soft:#38300f; --bad:#ff8585; --bad-soft:#3b1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#1a222c; --ink:#e8edf3; --mute:#94a0ae; --line:#2e3946;
  --accent:#7c97ff; --accent-ink:#0d1220; --accent-soft:#222c4d;
  --ok:#5fcf8e; --ok-soft:#173326; --warn:#e8b94a; --warn-soft:#38300f; --bad:#ff8585; --bad-soft:#3b1d1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 18px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.where{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.where b{color:var(--ink);font-weight:700}
.track{display:flex;gap:3px;flex-wrap:wrap}
.seg{flex:1 0 14px;max-width:22px;height:8px;border-radius:2px;background:var(--line)}
.seg.on{background:var(--ok)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line)}
nav button{font:500 14px var(--sans);background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 12px;margin-bottom:-1px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.tag{display:inline-block;font:500 12px var(--sans);letter-spacing:.04em;color:var(--mute);margin-bottom:6px}
.ctx{color:var(--mute);font-size:14px;margin:0 0 4px}
.ko{font:700 clamp(22px,5vw,28px)/1.45 var(--serif);margin:0 0 20px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:10px}
input[type=text]{width:100%;font:500 18px var(--mono);padding:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:500 14px var(--sans);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kbd{font:500 12px var(--mono);color:var(--mute)}
.hint{font:500 15px var(--mono);color:var(--accent);min-height:1.5em}
.result{margin-top:16px;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.result.PASS{background:var(--ok-soft)}.result.MINOR_TYPO{background:var(--warn-soft)}.result.FAIL{background:var(--bad-soft)}
.pill{align-self:flex-start;font:700 12px var(--sans);letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.PASS .pill{color:var(--ok)}.MINOR_TYPO .pill{color:var(--warn)}.FAIL .pill{color:var(--bad)}
.answer{font:500 16px var(--mono);overflow-wrap:anywhere}
.done-msg{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.stat .n{font:700 26px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.stat .l{color:var(--mute);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bar span{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.item small{display:block;color:var(--mute);font:400 13px var(--mono);overflow-wrap:anywhere}
.count{font:700 13px var(--sans);color:var(--bad);white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:32px 0}
h2{font:700 15px var(--sans);margin:0 0 4px}
@media (prefers-reduced-motion:no-preference){.result{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>패턴 영작</h1>
    <div class="where" id="where"></div>
  </header>
  <div class="track" id="track" role="img" aria-label="챕터 패턴 달성 현황"></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-t="study" aria-selected="true">학습</button>
    <button role="tab" data-t="wrong" aria-selected="false">오답노트</button>
    <button role="tab" data-t="done" aria-selected="false">학습완료노트</button>
    <button role="tab" data-t="stats" aria-selected="false">대시보드</button>
  </nav>
  <main id="main"></main>
</div>
<script>
const $=(i)=>document.getElementById(i);
const esc=(s)=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,b)=>fetch(p,b?{method:"POST",body:JSON.stringify(b)}:{}).then(r=>r.json());
let card=null,t0=0,hinted=false,busy=false,state="input",timer=null,tab="study";

function board(b){
  $("where").innerHTML=`남은 <b>${b.remaining}</b>개 · 전체 ${b.total}개`;
  $("track").innerHTML=b.badges.map(x=>`<span class="seg${x?" on":""}"></span>`).join("");
}
function show(t){
  tab=t; document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));
  if(t==="study") return card?renderCard():next();
  if(t==="stats") return stats(); notes(t);
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show(b.dataset.t)});

async function next(){
  clearTimeout(timer); const {card:c}=await api("/api/next"); card=c; hinted=false; state="input";
  if(!c){ $("main").innerHTML=`<div class="card"><p class="done-msg">이 챕터의 패턴을 모두 완료했어요.</p><p class="ctx">완료한 패턴은 복습일에만 다시 나옵니다.</p><button class="btn primary" id="nc">다음 챕터 열기</button></div>`; $("nc").onclick=()=>api("/api/open").then(()=>next()); return; }
  board(c.board); renderCard();
}
function renderCard(){
  if(!card) return next();
  $("main").innerHTML=`<div class="card">
    ${card.review?'<span class="tag">복습</span>':''}
    ${card.context?`<p class="ctx">${esc(card.context)}</p>`:''}
    <p class="ko">${esc(card.ko)}</p>
    <div class="field">
      <input id="in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력" aria-label="영어 답안">
      <div class="row">
        ${card.hintAvailable?'<button class="btn" id="hb" type="button">힌트</button>':''}
        <button class="btn primary" id="sb" type="button">제출</button>
        <span class="kbd">Enter</span><span class="kbd" style="margin-left:auto">${card.timeLimitSec}초 기준</span>
      </div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="res" aria-live="polite"></div></div>`;
  const i=$("in"); i.focus(); t0=Date.now();
  i.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); state==="shown"?next():submit(); }});
  $("sb").onclick=()=>state==="shown"?next():submit();
  const hb=$("hb"); if(hb) hb.onclick=async()=>{ const h=await api("/api/hint",{sentenceId:card.sentenceId}); hinted=true; $("hint").textContent="필수 구문: "+(h.hint||""); i.focus(); };
}
async function submit(){
  if(busy||!card) return; const i=$("in"); if(!i.value.trim()) return; busy=true;
  const r=await api("/api/submit",{sentenceId:card.sentenceId,input:i.value,usedHint:hinted,elapsedMs:Date.now()-t0}); busy=false;
  if(r.kind==="error"){ $("res").innerHTML=`<div class="result FAIL"><span class="pill">채점 오류</span><span>${esc(r.message)}</span></div>`; return; }
  board(r.board); const lab={PASS:"정답",MINOR_TYPO:"오타",FAIL:"오답"}[r.verdict];
  if(r.verdict==="MINOR_TYPO"){ $("res").innerHTML=`<div class="result MINOR_TYPO"><span class="pill">${lab}</span><span>거의 맞았어요. 고쳐서 다시 입력하세요.</span></div>`; i.select(); t0=Date.now(); return; }
  state="shown"; i.readOnly=true;
  $("res").innerHTML=`<div class="result ${r.verdict}"><span class="pill">${lab}${r.patternCompleted?" · 패턴 완료":""}</span><span class="answer">${esc(r.answer)}</span><span class="kbd">Enter로 다음 문제</span></div>`;
  if(r.verdict==="PASS") timer=setTimeout(()=>{ if(tab==="study") next(); },1100);
}
async function notes(t){
  $("main").innerHTML='<p class="empty">불러오는 중…</p>'; const n=await api("/api/notes"); const list=t==="wrong"?n.wrong:n.completed;
  const title=t==="wrong"?"오답노트":"학습완료노트", sub=t==="wrong"?"틀린 횟수가 많은 순서":"연속 2회 정답으로 완료한 패턴";
  $("main").innerHTML=`<h2>${title} · ${list.length}개</h2><p class="ctx">${sub}</p><div class="list">`+
    (list.length?list.map(x=>t==="wrong"?`<div class="item"><div>패턴 #${x.patternId}<small>마지막 입력: ${esc(x.lastWrongInput)}</small></div><span class="count">${x.wrongCount}회</span></div>`:`<div class="item"><div>패턴 #${x.patternId}</div><span class="ctx">${new Date(x.completedAt).toLocaleDateString("ko-KR")}</span></div>`).join(""):`<p class="empty">${t==="wrong"?"틀린 문제가 없어요.":"아직 완료한 패턴이 없어요."}</p>`)+"</div>";
}
async function stats(){
  $("main").innerHTML='<p class="empty">불러오는 중…</p>'; const s=await api("/api/stats"); const d=s.days.slice(-14); const max=Math.max(1,...d.map(x=>x.attempts));
  $("main").innerHTML=`<div class="stats">
    <div class="stat"><div class="n">${s.streakDays}일</div><div class="l">연속 학습</div></div>
    <div class="stat"><div class="n">${s.today.attempts}</div><div class="l">오늘 푼 문제</div></div>
    <div class="stat"><div class="n">${Math.round(s.today.firstTryCorrectRate*100)}%</div><div class="l">오늘 첫 시도 정답률</div></div>
    <div class="stat"><div class="n">${(s.today.avgElapsedMs/1000).toFixed(1)}초</div><div class="l">오늘 평균 반응</div></div>
    <div class="stat"><div class="n">${s.totalCompleted}</div><div class="l">누적 완료 패턴</div></div></div>
    <div class="card" style="margin-top:12px"><h2>최근 14일 푼 문제 수</h2>${d.length?`<div class="bars">${d.map(x=>`<div class="bar" title="${x.date}"><span>${x.attempts}</span><i style="height:${Math.max(2,x.attempts/max*80)}%"></i><span>${x.date.slice(8)}</span></div>`).join("")}</div>`:'<p class="empty">아직 기록이 없어요.</p>'}</div>`;
}
next();
</script>
</body>
</html>
