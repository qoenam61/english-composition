<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>패턴 영작</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--card:#fff;--line:#ddd;--ok:#2e9e5b;--warn:#d9a400;--bad:#d64545;--mut:#777}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--card:#222;--line:#444;--mut:#aaa}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:20px;margin-top:12px}
.card.PASS{border-color:var(--ok)}.card.MINOR_TYPO{border-color:var(--warn)}.card.FAIL{border-color:var(--bad)}
.ctx{color:var(--mut);font-size:14px}.ko{font-size:22px;margin:8px 0 16px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{padding:10px 16px;margin-top:10px;margin-right:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.b{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.b.on{background:var(--ok);border-color:var(--ok)}
.bar{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
</style></head><body><main>
<div class="bar"><strong>패턴 영작</strong><span id="remain"></span></div>
<nav><button onclick="tab('study')">학습</button><button onclick="tab('wrong')">오답노트</button><button onclick="tab('done')">학습완료노트</button><button onclick="tab('stats')">대시보드</button></nav>
<div id="panel" style="display:none"></div>
<div class="badges" id="badges" aria-label="챕터 패턴 달성 배지"></div>
<div id="stage"></div>
<p class="ctx" id="msg"></p>
</main>
<script>
let card=null,t0=0,hinted=false,busy=false;
const $=(i)=>document.getElementById(i);
const api=(p,b)=>fetch(p,b?{method:"POST",body:JSON.stringify(b)}:{}).then(r=>r.json());
function board(b){ $("remain").textContent=`남은 ${b.remaining}개 / ${b.total}`; $("badges").innerHTML=b.badges.map(x=>`<span class="b${x?" on":""}"></span>`).join(""); }
async function next(){
  const {card:c}=await api("/api/next"); card=c; hinted=false; $("msg").textContent="";
  if(!c){ $("stage").innerHTML='<div class="card">이 챕터의 패턴을 모두 완료했어요. 다시 열어 다음 챕터로 이어가세요.<br><button onclick="location.reload()">다음 챕터</button></div>'; return; }
  board(c.board);
  $("stage").innerHTML=`<div class="card" id="card">${c.review?'<div class="ctx">복습</div>':''}${c.context?`<div class="ctx">${c.context}</div>`:''}<div class="ko">${c.ko}</div><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력 후 Enter"><div>${c.hintAvailable?'<button id="hb">힌트</button>':''}</div><div class="ctx" id="hint"></div></div>`;
  const inp=$("in"); inp.focus(); t0=Date.now();
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") submit(); });
  const hb=$("hb"); if(hb) hb.onclick=async()=>{ const h=await api("/api/hint",{sentenceId:c.sentenceId}); hinted=true; $("hint").textContent="필수 구문: "+(h.hint||""); inp.focus(); };
}
async function submit(){
  if(busy||!card) return; const input=$("in").value; if(!input.trim()) return; busy=true;
  const r=await api("/api/submit",{sentenceId:card.sentenceId,input,usedHint:hinted,elapsedMs:Date.now()-t0}); busy=false;
  if(r.kind==="error"){ $("msg").textContent=r.message; return; }
  board(r.board); $("card").className="card "+r.verdict;
  if(r.verdict==="MINOR_TYPO"){ $("msg").textContent="거의 맞았어요 — 오타를 고쳐 다시 입력하세요."; const i=$("in"); i.select(); t0=Date.now(); return; }
  $("msg").textContent=(r.verdict==="PASS"?"정답! ":"오답. ")+"정답: "+r.answer+(r.patternCompleted?"  ✔ 패턴 완료":"");
  setTimeout(next, r.verdict==="PASS"?900:2200);
}
function tab(t){
  const st=$("stage"),pn=$("panel"); if(t==="study"){ pn.style.display="none"; st.style.display=""; if(!card) next(); return; }
  st.style.display="none"; pn.style.display=""; pn.innerHTML="불러오는 중…";
  if(t==="stats") return api("/api/stats").then(s=>{ pn.innerHTML=`<div class="card"><b>연속 학습일 ${s.streakDays}일</b><br>오늘 ${s.today.attempts}문제 · 패턴 ${s.today.patternsCompleted}개 완료 · 첫 시도 정답률 ${Math.round(s.today.firstTryCorrectRate*100)}% · 평균 ${(s.today.avgElapsedMs/1000).toFixed(1)}초<br>누적 ${s.totalAttempts}문제 · 완료 패턴 ${s.totalCompleted}개</div><div class="card">${s.days.slice(-14).map(d=>`<div class="ctx">${d.date} · ${d.attempts}문제 · 완료 ${d.patternsCompleted}</div>`).join("")||"기록 없음"}</div>`; });
  api("/api/notes").then(n=>{ const list=t==="wrong"?n.wrong:n.completed;
    pn.innerHTML=`<div class="card">${t==="wrong"?"오답노트 (틀린 횟수 많은 순)":"학습완료노트"} — ${list.length}개</div>`+list.map(x=>t==="wrong"?`<div class="card">패턴 #${x.patternId} · ${x.wrongCount}회 오답<div class="ctx">마지막 입력: ${x.lastWrongInput.replace(/</g,"&lt;")}</div></div>`:`<div class="card">패턴 #${x.patternId} 완료</div>`).join(""); });
}
next();
</script></body></html>
